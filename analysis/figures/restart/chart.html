const YMAX = { sol: 100, terra: 50 }, YT = { sol: [0, 50, 100], terra: [0, 25, 50] };
function layout() {
  const labelW = Math.max(...P.flatMap((p) => ARMS.map((a) => measure(NAME[a], LBL, 600) + 8 + measure(pct(p.A[a].final), VAL, 700))));
  const plotL = 58, plotR = W - labelW - 30, lx = plotR + 24;
  const head = 50, inGap = 18, tickH = 40, secGap = 34;
  const ph = (H - 2 * (2 * head + inGap + tickH) - secGap) / 4;
  let top = 0;
  const out = [];
  for (const b of [32, 8]) {
    const x = linear(0, b, plotL, plotR);
    for (const m of ['sol', 'terra']) {
      const p = P.find((q) => q.model === m && q.budgetM === b);
      const pTop = top + head, pBot = pTop + ph;
      const y = linear(0, YMAX[m], pBot, pTop);
      // end labels: one column right of the ends, top to bottom in the order of the finals, pushed apart to 27 px
      const items = ARMS.map((a) => ({ a, dy: y(p.A[a].curve.at(-1)[1]), ly: y(p.A[a].curve.at(-1)[1]) })).sort((u, v) => u.dy - v.dy);
      for (let k = 0; k < 80; k++) {
        let moved = false;
        for (let j = 1; j < items.length; j++) {
          const d = items[j].ly - items[j - 1].ly;
          if (d < 27) { items[j].ly += (27 - d) / 2; items[j - 1].ly -= (27 - d) / 2; moved = true; }
        }
        if (!moved) break;
      }
      const shift = Math.max(0, pTop - 10 - items[0].ly);    // keep the top label inside its panel band
      for (const d of items) d.ly += shift;
      console.assert(items[0].a === 'restarted', 'restarted label on top');
      out.push({ p, x, y, pTop, pBot, top, last: m === 'terra', first: m === 'sol', items, hero: { x: lx, y: items[0].ly + 7.5 - 36 } });
      top = pBot + (m === 'sol' ? inGap : tickH + secGap);
    }
  }
  return { plotL, plotR, lx, out, ph };
}
let L = null;

// a best-so-far mean line (steps) cut off at pen position xp (in M)
function stepPts(curve, xp, x, y) {
  if (xp <= 0) return [];
  const out = [[x(curve[0][0]), y(curve[0][1])]];
  let v = curve[0][1];
  for (let j = 1; j < curve.length && curve[j][0] <= xp; j++) {
    out.push([x(curve[j][0]), y(v)]);
    v = curve[j][1];
    out.push([x(curve[j][0]), y(v)]);
  }
  out.push([x(Math.min(xp, curve.at(-1)[0])), y(v)]);
  return out;
}
const penU = (t, beatName) => prog(t, BEATS[beatName][0], PEN[beatName], ease.inOut);
const beatOf = (p, a) => (a === 'restarted' ? p.beat[1] : p.beat[0]);
const penEnd = (beatName) => BEATS[beatName][0] + PEN[beatName];

function draw(t) {
  svg.replaceChildren();
  svg.setAttribute('fill', C.ink);
  if (!L) L = layout();
  const { plotL, plotR, lx, out } = L;

  for (const o of out) {
    const { p, x, y, pTop, pBot, top } = o, b = p.budgetM;
    // scaffold: a hairline above the 8M pair, panel name, budget, gridlines, ticks
    if (o.first && b === 8) h(svg, 'line', { x1: 0, x2: W, y1: top - 16, y2: top - 16, stroke: C.grid, 'stroke-width': MARK.grid });
    const nm = MODEL[p.model].name;
    h(svg, 'text', { x: 0, y: top + 28, 'font-size': TYPE.name, 'font-weight': 700, fill: C.ink }, nm);
    h(svg, 'text', { x: measure(nm, TYPE.name, 700) + 14, y: top + 28, 'font-size': TYPE.label, fill: C.muted }, `${b}M weighted tokens`);
    grid(svg, { axis: 'y', scale: y, values: YT[p.model], from: plotL, to: plotR, fmt: (v) => v + '%', base: 0 });
    if (o.last) {
      const step = b / 8;
      for (let k = 0; k <= 8; k++) h(svg, 'text', { class: 'tick', x: x(k * step), y: pBot + 28, 'text-anchor': 'middle' }, k ? `${k * step}M` : '0');
    }

    // the gap: a dotted line between the team's and the restarted agent's ends, under the marks, then the number
    const ce = penEnd(p.beat[1]) + 0.2;
    const yT = y(p.A.selforg.curve.at(-1)[1]), yR = y(p.A.restarted.curve.at(-1)[1]);
    callout(svg, [[plotR, yT], [plotR, yR]], prog(t, ce, 0.5, ease.linear),
      { hero: pts(p.gap), words: 'vs team', x: o.hero.x, y: o.hero.y, anchor: 'start' });

    // lines, back to front
    for (const a of ARMS) {
      const c = p.A[a].curve, xp = penU(t, beatOf(p, a)) * b;
      const sp = stepPts(c, xp, x, y);
      if (sp.length > 1) h(svg, 'path', { d: linePath(sp), fill: 'none', stroke: SETUP[a].line, 'stroke-width': MARK.series.mean,
        'stroke-linejoin': 'round', 'stroke-linecap': 'round' });
    }
    // end dots, then labels with leaders where a label had to move
    for (const a of ARMS) {
      const te = penEnd(beatOf(p, a)), ye = y(p.A[a].curve.at(-1)[1]);
      mean(svg, a, plotR, ye, prog(t, te - 0.05, MOTION.pop), { dense: true });
    }
    for (const it of o.items) {
      const a = it.a, op = fade(t, penEnd(beatOf(p, a)) + 0.08, MOTION.label);
      if (op <= 0) continue;
      if (Math.abs(it.ly - it.dy) > 3)
        h(svg, 'path', { d: `M${plotR + MARK.mean.rDense + 3},${it.dy}L${lx - 5},${it.ly}`, stroke: C.axis, 'stroke-width': 1.5, fill: 'none', opacity: op });
      const el = tag(svg, lx, it.ly + 7.5, NAME[a], { setup: a, size: LBL, opacity: op });
      h(el, 'tspan', { 'font-size': VAL, 'font-weight': 700 }, ' ' + pct(p.A[a].final));
    }
  }
}

boot();
</script>
