// ---- layout, computed once W and H are known
let LAY = null;
function layout() {
  if (LAY && LAY.W === W && LAY.H === H) return LAY;
  const L = { W, H };
  L.keyY = 20; L.headY2 = 46; L.top = 58; L.hh = 38; L.sh = 27; L.tg = 14; L.bot = 62; L.indent = 20;
  const nBlocks = TASKS.reduce((a, T) => a + new Set(ROWS.filter((r) => r.task === T.key).map((r) => r.setup)).size, 0);
  L.rh = (H - L.top - L.bot - TASKS.length * L.hh - (TASKS.length - 1) * L.tg - nBlocks * L.sh) / ROWS.length;
  L.labW = Math.max(L.indent + Math.max(...['Claude Sonnet 5.5', `GPT-6.1 Terra ${PEND}`].map((s) => measure(s, TYPE.annot, 400))),
    measure(SETUP.selforg.name, TYPE.annot, 700));
  L.colW = 50;                                   // one number column (2, 4, 8 agents)
  L.plotL = L.labW + 28;
  L.plotR = W - 3 * L.colW - 26;
  L.nx = (j) => L.plotR + 26 + L.colW * (j + 1); // right edge of number column j
  L.x = linear(-64, 12, L.plotL, L.plotR);
  L.tasks = [];
  let y = L.top;
  for (const T of TASKS) {
    const P = { ...T, headY: y + 27, blocks: [] };
    y += L.hh;
    for (const setup of ['ttc', 'board']) {
      const rows = ROWS.filter((r) => r.task === T.key && r.setup === setup);
      if (!rows.length) continue;
      const B = { setup, headY: y + 19 };
      y += L.sh;
      B.y0 = y;
      B.rows = rows.map((r) => ({ ...r, cy: (y += L.rh) - L.rh / 2 }));
      B.y1 = y;
      P.blocks.push(B);
    }
    P.y1 = y;
    L.tasks.push(P);
    y += L.tg;
  }
  L.bottom = y - L.tg;
  L.order = L.tasks.flatMap((P) => P.blocks.flatMap((B) => B.rows));
  return (LAY = L);
}

// an arrow from x1 (the edge of the no-talk mark, r away) to x2 at y, drawn out to fraction u; drawn over the mark,

function arrow(parent, x1, x2, y, u, { color, width = 4, head = 10, hollow = false, r = 0 }) {
  if (u <= 0) return;
  const dir = x2 >= x1 ? 1 : -1, len = Math.abs(x2 - x1), xe = x1 + dir * len * u;
  const hl = head * 1.2, hw = head * 0.75, xb = xe - dir * hl, xs = x1 + dir * r;
  if ((xb - xs) * dir > 0) h(parent, 'line', { x1: xs, x2: xb, y1: y, y2: y, stroke: color, 'stroke-width': width, 'stroke-linecap': 'butt' });
  h(parent, 'path', { d: `M${xe},${y}L${xb},${y - hw}L${xb},${y + hw}Z`, fill: hollow ? C.bg : color, stroke: hollow ? color : C.bg,
    'stroke-width': hollow ? 2 : 1.2, 'stroke-linejoin': 'round', 'paint-order': 'stroke' });
}
const whole = (v) => { const r = Math.round(v); return `${sgn(r)}${Math.abs(r)}`; };
const MARK_R = 8;

function draw(t) {
  svg.replaceChildren();
  svg.setAttribute('fill', C.ink);
  const L = layout(), x = L.x, x0 = x(0);

  // scaffold: gridlines per block (so no line crosses a name), ticks and axis title at the bottom
  const ticks = [-60, -40, -20, 10];
  for (const P of L.tasks) for (const B of P.blocks)
    grid(svg, { axis: 'x', scale: x, values: ticks, from: B.y0 + 1, to: B.y1 - 1, label: false });
  [-60, -40, -20, 0, 10].forEach((v) => h(svg, 'text', { class: 'tick', x: x(v), y: L.bottom + 28, 'text-anchor': 'middle' }, v ? pct(v) : '0'));
  h(svg, 'text', { class: 'axis-title', x: L.plotR, y: L.bottom + 56, 'text-anchor': 'end' }, 'Score vs the same model’s single agent with 8M');

  // key: what the marks and the arrow are; the number columns' heading
  const ky = L.keyY;
  shape(svg, 'circle', 8, ky - 7, MARK_R, { fill: SETUP.notalk.fill });
  shape(svg, 'square', 30, ky - 7, MARK_R, { fill: SETUP.notalk.fill });
  let kx = 48;
  h(svg, 'text', { x: kx, y: ky, 'font-size': TYPE.annot, fill: C.ink }, 'No-talk team of 8'); kx += measure('No-talk team of 8', TYPE.annot) + 22;
  arrow(svg, kx, kx + 34, ky - 7, 1, { color: C.muted, width: 3.5, head: 9 }); kx += 44;
  h(svg, 'text', { x: kx, y: ky, 'font-size': TYPE.annot, fill: C.ink }, 'the team that talked');
  h(svg, 'text', { x: L.nx(2), y: ky, 'font-size': TYPE.tick, fill: C.muted, 'text-anchor': 'end' }, 'Talking added, pts');
  KS.forEach((k, j) => h(svg, 'text', { x: L.nx(j), y: L.headY2, 'font-size': TYPE.tick, fill: C.muted, 'text-anchor': 'end' }, String(k)));
  h(svg, 'text', { x: L.nx(0) - measure('2', TYPE.tick) - 10, y: L.headY2, 'font-size': TYPE.tick, fill: C.muted, 'text-anchor': 'end' }, 'Team of');

  // context: the single agent at 0
  const [c0, cd] = BEATS.context;
  refLine(svg, 'single', x0, ky + 10, x0, L.bottom, prog(t, c0, cd, ease.inOut));
  tag(svg, x0 + 10, ky, SETUP.single.name, { setup: 'single', anchor: 'end', opacity: fade(t, c0 + 0.3, 0.3) });

  const [s0, sd] = BEATS.split, [a0, ad] = BEATS.talk;
  const nRows = L.order.length;
  for (const P of L.tasks) {
    h(svg, 'text', { x: 0, y: P.headY, 'font-size': TYPE.name, 'font-weight': 700, fill: C.ink }, P.name);
    h(svg, 'text', { x: measure(P.name, TYPE.name, 700) + 14, y: P.headY, 'font-size': TYPE.tick, fill: C.muted }, P.note);
    for (const B of P.blocks) {
      const kit = KIT[B.setup], tb = a0 + (L.order.indexOf(B.rows[0]) / nRows) * (ad - 0.7);
      // the setup's name: ink at frame 0, its own color once its first arrow grows
      h(svg, 'text', { x: 0, y: B.headY, 'font-size': TYPE.annot, 'font-weight': 700, fill: mix(C.ink, SETUP[kit].text, prog(t, tb, MOTION.recolor)) }, SETUP[kit].name);
      for (const r of B.rows) {
        const i = L.order.indexOf(r), cy = r.cy, c = r.lanes[8], kind = MODEL[r.model].shape;
        const tn = s0 + (i / nRows) * (sd - 0.3), tt = a0 + (i / nRows) * (ad - 0.7);
        const pend = KS.some((k) => r.lanes[k] && r.lanes[k].pending);
        h(svg, 'text', { x: L.indent, y: cy + 8, 'font-size': TYPE.annot, fill: C.ink }, MODEL[r.model].name + (pend ? ` ${PEND}` : ''));
        // the no-talk team of 8 (the cost of splitting), then the arrow to the team that talked (what talking added)
        const hollow = !c.counted, u = prog(t, tn, MOTION.pop);
        if (u > 0) {
          if (hollow) shape(svg, kind, x(c.nt), cy, Math.max(0.1, MARK_R * u - 1.25), { fill: C.bg, stroke: SETUP.notalk.line, 'stroke-width': 2.5 });
          else shape(svg, kind, x(c.nt), cy, MARK_R * u, { fill: SETUP.notalk.fill, stroke: C.bg, 'stroke-width': 1.5 });
        }
        arrow(svg, x(c.nt), x(c.team), cy, prog(t, tt, 0.6, ease.inOut), { color: SETUP[kit].line, hollow, r: MARK_R });
        // what talking added at each team size
        const o = fade(t, tt + 0.45, 0.3);
        KS.forEach((k, j) => {
          const q = r.lanes[k];
          if (o > 0) h(svg, 'text', { x: L.nx(j), y: cy + 8, 'text-anchor': 'end', 'font-size': TYPE.small, 'font-weight': k === 8 ? 700 : 400,
            fill: q ? SETUP[kit].text : C.muted, opacity: o }, q ? whole(q.talk) : '–');
        });
        // the one no-talk team that beat its single agent: say so where its number shows
        const odd = KS.map((k) => r.lanes[k]).find((q) => q && q.task === 'gitzig' && q.nt > 0);
        if (odd) tag(svg, x(c.nt) - 20, cy + 7, `No-talk team of ${odd.k} was ${pct(odd.nt)}`, { size: TYPE.tick, weight: 400, fill: C.muted, anchor: 'end', opacity: o });
      }
    }
  }

  // callouts: the largest gain on git-to-zig, then each AHC task's GPT rows
  const [k0] = BEATS.callout;
  const bb = L.tasks.find((P) => P.key === BEST.task).blocks.find((B) => B.setup === BEST.setup);
  callout(svg, [], prog(t, k0, 0.7), { hero: pts(BEST.talk), words: 'with talking', x: x((BEST.nt + BEST.team) / 2), y: bb.headY + 6, anchor: 'middle' });
  ['ahc014', 'ahc038'].forEach((task, j) => {
    const rs = L.order.filter((r) => r.task === task && isGPT(r.model));
    const cs = rs.flatMap((r) => KS.map((k) => r.lanes[k]).filter(Boolean));
    const lower = cs.filter((c) => c.talk < 0).length;
    const y0 = rs[0].cy - 11, y1 = rs[rs.length - 1].cy + 11, bx = x(-18);
    callout(svg, [[bx + 10, y0], [bx, y0], [bx, y1], [bx + 10, y1]], prog(t, k0 + 0.35 * (j + 1), 0.7),
      { hero: `${lower} of ${cs.length}`, words: 'lower with talking, all sizes', x: bx - 14, y: rs[1].cy + 11, anchor: 'end' });
  });
}

boot();
</script>
